<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Indigo Outer Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Maximized D6 Die Body with Prominent Rounded Corners -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="url(#dieGrad)" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>

  <!-- Pips (5 Round Dark Indigo Circles) -->
  <circle cx="19" cy="19" r="4.5" fill="#312e81" />
  <circle cx="45" cy="19" r="4.5" fill="#312e81" />
  <circle cx="32" cy="32" r="4.5" fill="#312e81" />
  <circle cx="19" cy="45" r="4.5" fill="#312e81" />
  <circle cx="45" cy="45" r="4.5" fill="#312e81" />
</svg>
